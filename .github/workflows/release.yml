name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: sharedrop-windows-amd64.exe
          - goos: windows
            goarch: arm64
            name: sharedrop-windows-arm64.exe
          - goos: linux
            goarch: amd64
            name: sharedrop-linux-amd64
          - goos: linux
            goarch: arm64
            name: sharedrop-linux-arm64
          - goos: darwin
            goarch: amd64
            name: sharedrop-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: sharedrop-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/${{ matrix.name }} \
            ./

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: "ShareDrop ${{ github.ref_name }}"
          body: |
            ## ShareDrop ${{ github.ref_name }}

            Local network file sharing — single binary, no setup.

            ### Quick install

            **Windows** (PowerShell):
            ```powershell
            .\sharedrop-windows-amd64.exe install
            sharedrop
            ```

            **Linux / macOS**:
            ```bash
            chmod +x sharedrop-linux-amd64
            sudo mv sharedrop-linux-amd64 /usr/local/bin/sharedrop
            sharedrop install
            sharedrop
            ```

            ### Features
            - Web UI with dark/light mode
            - QR code in terminal for mobile access
            - Upload progress bar
            - Password protection
            - Drag & drop upload
            - Filesystem root browsing (`--root`)
            - Self-install to PATH (`install` command)

            ### Checksums
            See `checksums.txt`
          files: dist/*
          draft: false
          prerelease: false
