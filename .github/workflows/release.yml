name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            name: sharedrop-windows-amd64.exe
          - goos: windows
            goarch: arm64
            ext: .exe
            name: sharedrop-windows-arm64.exe
          - goos: linux
            goarch: amd64
            ext: ''
            name: sharedrop-linux-amd64
          - goos: linux
            goarch: arm64
            ext: ''
            name: sharedrop-linux-arm64
          - goos: darwin
            goarch: amd64
            ext: ''
            name: sharedrop-darwin-amd64
          - goos: darwin
            goarch: arm64
            ext: ''
            name: sharedrop-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/${{ matrix.name }} \
            ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ShareDrop ${{ github.ref_name }}"
          body: |
            ## 📦 ShareDrop ${{ github.ref_name }}

            Local network file sharing, done right.

            ### Installation

            Download the binary for your platform below, make it executable, and run it:

            ```bash
            # Linux / macOS
            chmod +x sharedrop-*
            ./sharedrop-linux-amd64

            # Windows — just double-click or run in terminal
            sharedrop-windows-amd64.exe
            ```

            ### What's new
            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Checksums
            See `checksums.txt` for SHA-256 hashes.
          files: |
            dist/*
          draft: false
          prerelease: false
